<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Job Details</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-body">

            <div class="d-flex justify-content-between">

                <h2 th:text="${job.jobTitle}">
                    Java Developer
                </h2>

                <span class="badge bg-success"
                      th:text="${job.status}">
                    OPEN
                </span>

            </div>

            <hr>


            <h5>Job Information</h5>

            <p>
                <strong>Job Type:</strong>
                <span th:text="${job.jobType}">
                    Full Time
                </span>
            </p>

            <p>
                <strong>Location:</strong>
                <span th:text="${job.location}">
                    Pune
                </span>
            </p>

            <p>
                <strong>Required Skills:</strong>
                <span th:text="${job.requiredSkills}">
                    Java, Spring Boot, SQL
                </span>
            </p>

            <p>
                <strong>Minimum CGPA:</strong>
                <span th:text="${job.minCgpa}">
                    7.0
                </span>
            </p>

            <p>
                <strong>Experience:</strong>
                <span th:text="${job.experienceRequired}">
                    0
                </span>
                years
            </p>

            <p>
                <strong>Salary:</strong>
                ₹<span th:text="${job.salary}">
                    500000
                </span>
            </p>

            <p>
                <strong>Application Deadline:</strong>
                <span th:text="${job.applicationDeadline}">
                    2026-10-30
                </span>
            </p>


            <hr>


            <h5>Job Description</h5>

            <p th:text="${job.jobDescription}">
                Job description will appear here.
            </p>


            <hr>


            <a href="/company/jobs"
               class="btn btn-secondary">

                ← Back

            </a>

            <a th:href="@{/company/jobs/edit/{id}(id=${job.id})}"
               class="btn btn-warning">

                Edit Job

            </a>

        </div>

    </div>

</div>

</body>
</html>
