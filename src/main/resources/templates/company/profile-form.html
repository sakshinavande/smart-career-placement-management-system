<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Company Profile Form - Smart Career</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-light">

<!-- ================= NAVBAR ================= -->

<nav class="navbar navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand fw-bold"
           th:href="@{/company/dashboard}">
            Smart Career & Placement Management System
        </a>

        <div>

            <a th:href="@{/company/dashboard}"
               class="btn btn-outline-light btn-sm me-2">
                Dashboard
            </a>

            <form th:action="@{/logout}"
                  method="post"
                  style="display: inline;">

                <button type="submit"
                        class="btn btn-danger btn-sm">
                    Logout
                </button>

            </form>

        </div>

    </div>
</nav>


<!-- ================= MAIN CONTENT ================= -->

<div class="container mt-5 mb-5">

    <div class="row justify-content-center">

        <div class="col-md-8 col-lg-7">

            <div class="card shadow-sm">

                <!-- ================= CARD HEADER ================= -->

                <div class="card-header bg-primary text-white">

                    <h4 class="mb-0"
                        th:if="${company.id == null}">
                        Create Company Profile
                    </h4>

                    <h4 class="mb-0"
                        th:if="${company.id != null}">
                        Edit Company Profile
                    </h4>

                </div>


                <!-- ================= CARD BODY ================= -->

                <div class="card-body p-4">

                    <!-- ================= CREATE FORM ================= -->

                    <form th:if="${company.id == null}"
                          th:action="@{/company/profile/create}"
                          th:object="${company}"
                          method="post">

                        <!-- Company Name -->

                        <div class="mb-3">

                            <label for="companyName"
                                   class="form-label fw-bold">
                                Company Name
                            </label>

                            <input type="text"
                                   id="companyName"
                                   th:field="*{companyName}"
                                   class="form-control"
                                   placeholder="Enter company name"
                                   required>

                        </div>


                        <!-- Industry -->

                        <div class="mb-3">

                            <label for="industry"
                                   class="form-label fw-bold">
                                Industry
                            </label>

                            <input type="text"
                                   id="industry"
                                   th:field="*{industry}"
                                   class="form-control"
                                   placeholder="Example: Information Technology"
                                   required>

                        </div>


                        <!-- Location -->

                        <div class="mb-3">

                            <label for="location"
                                   class="form-label fw-bold">
                                Location
                            </label>

                            <input type="text"
                                   id="location"
                                   th:field="*{location}"
                                   class="form-control"
                                   placeholder="Example: Pune, Maharashtra"
                                   required>

                        </div>


                        <!-- Website -->

                        <div class="mb-3">

                            <label for="website"
                                   class="form-label fw-bold">
                                Company Website
                            </label>

                            <input type="url"
                                   id="website"
                                   th:field="*{website}"
                                   class="form-control"
                                   placeholder="https://example.com">

                            <div class="form-text">
                                Enter your official company website.
                            </div>

                        </div>


                        <!-- Description -->

                        <div class="mb-3">

                            <label for="description"
                                   class="form-label fw-bold">
                                Company Description
                            </label>

                            <textarea id="description"
                                      th:field="*{description}"
                                      class="form-control"
                                      rows="5"
                                      placeholder="Enter a short description about your company"
                                      required></textarea>

                        </div>


                        <!-- Buttons -->

                        <div class="mt-4">

                            <button type="submit"
                                    class="btn btn-primary me-2">
                                Save Profile
                            </button>

                            <a th:href="@{/company/dashboard}"
                               class="btn btn-secondary">
                                Cancel
                            </a>

                        </div>

                    </form>


                    <!-- ================= EDIT FORM ================= -->

                    <form th:if="${company.id != null}"
                          th:action="@{/company/profile/edit/{id}(id=${company.id})}"
                          th:object="${company}"
                          method="post">

                        <!-- Company Name -->

                        <div class="mb-3">

                            <label for="editCompanyName"
                                   class="form-label fw-bold">
                                Company Name
                            </label>

                            <input type="text"
                                   id="editCompanyName"
                                   th:field="*{companyName}"
                                   class="form-control"
                                   placeholder="Enter company name"
                                   required>

                        </div>


                        <!-- Industry -->

                        <div class="mb-3">

                            <label for="editIndustry"
                                   class="form-label fw-bold">
                                Industry
                            </label>

                            <input type="text"
                                   id="editIndustry"
                                   th:field="*{industry}"
                                   class="form-control"
                                   placeholder="Example: Information Technology"
                                   required>

                        </div>


                        <!-- Location -->

                        <div class="mb-3">

                            <label for="editLocation"
                                   class="form-label fw-bold">
                                Location
                            </label>

                            <input type="text"
                                   id="editLocation"
                                   th:field="*{location}"
                                   class="form-control"
                                   placeholder="Example: Pune, Maharashtra"
                                   required>

                        </div>


                        <!-- Website -->

                        <div class="mb-3">

                            <label for="editWebsite"
                                   class="form-label fw-bold">
                                Company Website
                            </label>

                            <input type="url"
                                   id="editWebsite"
                                   th:field="*{website}"
                                   class="form-control"
                                   placeholder="https://example.com">

                            <div class="form-text">
                                Enter your official company website.
                            </div>

                        </div>


                        <!-- Description -->

                        <div class="mb-3">

                            <label for="editDescription"
                                   class="form-label fw-bold">
                                Company Description
                            </label>

                            <textarea id="editDescription"
                                      th:field="*{description}"
                                      class="form-control"
                                      rows="5"
                                      placeholder="Enter a short description about your company"
                                      required></textarea>

                        </div>


                        <!-- Buttons -->

                        <div class="mt-4">

                            <button type="submit"
                                    class="btn btn-success me-2">
                                Update Profile
                            </button>

                            <a th:href="@{/company/profile}"
                               class="btn btn-secondary">
                                Cancel
                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>


<!-- ================= FOOTER ================= -->

<footer class="text-center text-muted mb-4">

    <p class="mb-1">
        © 2026 Smart Career & Placement Management System
    </p>

    <small>
        Company Module
    </small>

</footer>


<!-- Bootstrap JS -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
