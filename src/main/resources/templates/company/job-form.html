<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Job Form</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5 mb-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            <h3 class="mb-0">
                Post / Edit Job
            </h3>

        </div>


        <div class="card-body">

            <form th:action="${job.id == null}
                    ? @{/company/jobs/save}
                    : @{/company/jobs/update/{id}(id=${job.id})}"
                  th:object="${job}"
                  method="post">


                <!-- Job Title -->

                <div class="mb-3">

                    <label class="form-label">
                        Job Title
                    </label>

                    <input type="text"
                           th:field="*{jobTitle}"
                           class="form-control"
                           placeholder="Example: Java Developer"
                           required>

                </div>


                <!-- Job Type -->

                <div class="mb-3">

                    <label class="form-label">
                        Job Type
                    </label>

                    <select th:field="*{jobType}"
                            class="form-select"
                            required>

                        <option value="">
                            Select Job Type
                        </option>

                        <option value="Full Time">
                            Full Time
                        </option>

                        <option value="Internship">
                            Internship
                        </option>

                        <option value="Part Time">
                            Part Time
                        </option>

                        <option value="Contract">
                            Contract
                        </option>

                    </select>

                </div>


                <!-- Location -->

                <div class="mb-3">

                    <label class="form-label">
                        Location
                    </label>

                    <input type="text"
                           th:field="*{location}"
                           class="form-control"
                           placeholder="Example: Pune"
                           required>

                </div>


                <!-- Skills -->

                <div class="mb-3">

                    <label class="form-label">
                        Required Skills
                    </label>

                    <input type="text"
                           th:field="*{requiredSkills}"
                           class="form-control"
                           placeholder="Java, Spring Boot, MySQL, HTML, CSS"
                           required>

                    <small class="text-muted">
                        Separate skills using commas.
                    </small>

                </div>


                <!-- Minimum CGPA -->

                <div class="mb-3">

                    <label class="form-label">
                        Minimum CGPA
                    </label>

                    <input type="number"
                           th:field="*{minCgpa}"
                           class="form-control"
                           min="0"
                           max="10"
                           step="0.01"
                           placeholder="Example: 7.0">

                </div>


                <!-- Experience -->

                <div class="mb-3">

                    <label class="form-label">
                        Experience Required (Years)
                    </label>

                    <input type="number"
                           th:field="*{experienceRequired}"
                           class="form-control"
                           min="0"
                           placeholder="Example: 0">

                </div>


                <!-- Salary -->

                <div class="mb-3">

                    <label class="form-label">
                        Salary
                    </label>

                    <input type="number"
                           th:field="*{salary}"
                           class="form-control"
                           min="0"
                           step="0.01"
                           placeholder="Example: 500000">

                </div>


                <!-- Deadline -->

                <div class="mb-3">

                    <label class="form-label">
                        Application Deadline
                    </label>

                    <input type="date"
                           th:field="*{applicationDeadline}"
                           class="form-control">

                </div>


                <!-- Status -->

                <div class="mb-3">

                    <label class="form-label">
                        Status
                    </label>

                    <select th:field="*{status}"
                            class="form-select">

                        <option value="OPEN">
                            OPEN
                        </option>

                        <option value="CLOSED">
                            CLOSED
                        </option>

                    </select>

                </div>


                <!-- Description -->

                <div class="mb-3">

                    <label class="form-label">
                        Job Description
                    </label>

                    <textarea th:field="*{jobDescription}"
                              class="form-control"
                              rows="6"
                              placeholder="Enter job description...">
                    </textarea>

                </div>


                <button type="submit"
                        class="btn btn-primary">

                    Save Job

                </button>

                <a href="/company/jobs"
                   class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

</body>
</html>
