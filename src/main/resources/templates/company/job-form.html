
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Post / Edit Job | Smart Career</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5">

    <div class="row justify-content-center">
        <div class="col-lg-8">

            <div class="card shadow-sm border-0">

                <div class="card-header bg-primary text-white py-3">
                    <h3 class="mb-0"
                        th:text="${job.id == null ? 'Post a New Job' : 'Edit Job'}">
                        Post a New Job
                    </h3>
                </div>

                <div class="card-body p-4">

                    <!-- Validation error -->
                    <div th:if="${error != null}"
                         class="alert alert-danger"
                         th:text="${error}">
                    </div>

                    <form th:action="${job.id == null}
                            ? @{/company/jobs/save}
                            : @{/company/jobs/update/{id}(id=${job.id})}"
                          th:object="${job}"
                          method="post">

                        <!-- Job Title -->
                        <div class="mb-3">
                            <label for="jobTitle" class="form-label">
                                Job Title *
                            </label>

                            <input type="text"
                                   id="jobTitle"
                                   th:field="*{jobTitle}"
                                   class="form-control"
                                   placeholder="Example: Java Developer"
                                   maxlength="150"
                                   required>
                        </div>

                        <!-- Job Type -->
                        <div class="mb-3">
                            <label for="jobType" class="form-label">
                                Job Type *
                            </label>

                            <select id="jobType"
                                    th:field="*{jobType}"
                                    class="form-select"
                                    required>

                                <option value="">Select job type</option>
                                <option value="Full Time">Full Time</option>
                                <option value="Internship">Internship</option>
                                <option value="Part Time">Part Time</option>
                                <option value="Contract">Contract</option>
                            </select>
                        </div>

                        <!-- Location -->
                        <div class="mb-3">
                            <label for="location" class="form-label">
                                Job Location *
                            </label>

                            <input type="text"
                                   id="location"
                                   th:field="*{location}"
                                   class="form-control"
                                   placeholder="Example: Pune, Maharashtra"
                                   maxlength="200"
                                   required>
                        </div>

                        <!-- Required Skills -->
                        <div class="mb-3">
                            <label for="requiredSkills" class="form-label">
                                Required Skills *
                            </label>

                            <input type="text"
                                   id="requiredSkills"
                                   th:field="*{requiredSkills}"
                                   class="form-control"
                                   placeholder="Java, SQL, HTML, Spring Boot"
                                   required>

                            <div class="form-text">
                                Separate skills using commas.
                            </div>
                        </div>

                        <!-- Minimum CGPA -->
                        <div class="mb-3">
                            <label for="minCgpa" class="form-label">
                                Minimum CGPA
                            </label>

                            <input type="number"
                                   id="minCgpa"
                                   th:field="*{minCgpa}"
                                   class="form-control"
                                   min="0"
                                   max="10"
                                   step="0.01"
                                   placeholder="Example: 7.00">
                        </div>

                        <!-- Salary -->
                        <div class="mb-3">
                            <label for="salary" class="form-label">
                                Annual Salary (₹)
                            </label>

                            <input type="number"
                                   id="salary"
                                   th:field="*{salary}"
                                   class="form-control"
                                   min="0"
                                   step="0.01"
                                   placeholder="Example: 500000">

                            <div class="form-text">
                                Enter the annual salary in rupees, if applicable.
                            </div>
                        </div>

                        <!-- Application Deadline -->
                        <div class="mb-3">
                            <label for="deadline" class="form-label">
                                Application Deadline
                            </label>

                            <input type="date"
                                   id="deadline"
                                   th:field="*{deadline}"
                                   class="form-control">
                        </div>

                        <!-- Job Status -->
                        <div class="mb-4">
                            <label for="status" class="form-label">
                                Job Status
                            </label>

                            <select id="status"
                                    th:field="*{status}"
                                    class="form-select">

                                <option value="OPEN">OPEN</option>
                                <option value="CLOSED">CLOSED</option>
                            </select>

                            <div class="form-text">
                                New job postings default to OPEN in the backend
                                when no status is provided.
                            </div>
                        </div>

                        <!-- Actions -->
                        <div class="d-flex flex-wrap gap-2">

                            <button type="submit"
                                    class="btn btn-primary">
                                <span th:text="${job.id == null
                                    ? 'Post Job'
                                    : 'Update Job'}">
                                    Post Job
                                </span>
                            </button>

                            <a th:href="@{/company/jobs}"
                               class="btn btn-outline-secondary">
                                Cancel
                            </a>

                        </div>

                    </form>

                </div>
            </div>

            <p class="text-muted text-center mt-3 small">
                Smart Career &amp; Placement Management System
            </p>

        </div>
    </div>

</div>

</body>
</html>
