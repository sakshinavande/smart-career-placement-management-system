
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Applications - Smart Career</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" th:href="@{/student/dashboard}">
            Smart Career - Student
        </a>

        <a th:href="@{/student/jobs}" class="btn btn-light">
            Browse Jobs
        </a>
    </div>
</nav>

<div class="container mt-5">

    <h2>My Applications</h2>
    <p class="text-muted">Track the jobs you have applied for.</p>

    <!-- Success and error messages -->
    <div th:if="${successMessage != null}"
         class="alert alert-success"
         th:text="${successMessage}">
    </div>

    <div th:if="${errorMessage != null}"
         class="alert alert-danger"
         th:text="${errorMessage}">
    </div>

    <!-- Empty applications message -->
    <div th:if="${applications == null or #lists.isEmpty(applications)}"
         class="alert alert-info">
        You haven't applied for any jobs yet.
        <a th:href="@{/student/jobs}">Browse available jobs</a>.
    </div>

    <!-- Applications table -->
    <div class="table-responsive"
         th:if="${applications != null and !#lists.isEmpty(applications)}">

        <table class="table table-bordered table-striped bg-white align-middle">

            <thead class="table-primary">
            <tr>
                <th>Job Title</th>
                <th>Location</th>
                <th>Applied At</th>
                <th>Status</th>
            </tr>
            </thead>

            <tbody>
<tr th:each="app : ${applications}">
    <td th:text="${app.job.jobTitle}">Job Title</td>

    <td th:text="${app.job.location}">Location</td>

    <td th:text="${app.appliedAt != null ? #temporals.format(app.appliedAt, 'dd-MM-yyyy HH:mm') : 'N/A'}">
        Applied Date
    </td>

    <td>
        <span class="badge bg-success"
              th:text="${app.status}">
            APPLIED
        </span>
    </td>
</tr>
            </tbody>

        </table>
    </div>

    <a th:href="@{/student/dashboard}"
       class="btn btn-secondary mt-3">
        Back to Dashboard
    </a>

</div>

</body>
</html>
