<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Profile - Smart Career</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header">
            <h3 th:if="${student.id == null}">
                Create Student Profile
            </h3>

            <h3 th:unless="${student.id == null}">
                Edit Student Profile
            </h3>
        </div>

        <div class="card-body">

            <!-- CREATE PROFILE -->
            <form
                th:if="${student.id == null}"
                th:action="@{/student/profile/create}"
                method="post">

                <div class="mb-3">
                    <label class="form-label">Phone</label>

                    <input
                        type="text"
                        name="phone"
                        class="form-control"
                        placeholder="Enter phone number">
                </div>


                <div class="mb-3">
                    <label class="form-label">Date of Birth</label>

                    <input
                        type="date"
                        name="dateOfBirth"
                        class="form-control">
                </div>


                <div class="mb-3">
                    <label class="form-label">Gender</label>

                    <select
                        name="gender"
                        class="form-select">

                        <option value="">Select Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>

                    </select>
                </div>


                <div class="mb-3">
                    <label class="form-label">College Name</label>

                    <input
                        type="text"
                        name="collegeName"
                        class="form-control"
                        placeholder="Enter college name">
                </div>


                <div class="mb-3">
                    <label class="form-label">Course</label>

                    <input
                        type="text"
                        name="course"
                        class="form-control"
                        placeholder="Example: BCS">
                </div>


                <div class="mb-3">
                    <label class="form-label">Graduation Year</label>

                    <input
                        type="number"
                        name="graduationYear"
                        class="form-control"
                        placeholder="Example: 2027">
                </div>


                <div class="mb-3">
                    <label class="form-label">CGPA</label>

                    <input
                        type="number"
                        step="0.01"
                        name="cgpa"
                        class="form-control"
                        placeholder="Example: 8.75">
                </div>


                <div class="mb-3">
                    <label class="form-label">Percentage</label>

                    <input
                        type="number"
                        step="0.01"
                        name="percentage"
                        class="form-control"
                        placeholder="Example: 85.50">
                </div>


                <div class="mb-3">
                    <label class="form-label">Backlogs</label>

                    <input
                        type="number"
                        name="backlogs"
                        class="form-control"
                        value="0"
                        min="0">
                </div>


                <button
                    type="submit"
                    class="btn btn-primary">

                    Create My Profile

                </button>

                <a
                    href="/student/profile"
                    class="btn btn-secondary">

                    Cancel

                </a>

            </form>


            <!-- EDIT PROFILE -->
            <form
                th:unless="${student.id == null}"
                th:action="@{/student/profile/edit/{id}(id=${student.id})}"
                method="post">

                <div class="mb-3">
                    <label class="form-label">Phone</label>

                    <input
                        type="text"
                        name="phone"
                        class="form-control"
                        th:value="${student.phone}">
                </div>


                <div class="mb-3">
                    <label class="form-label">Date of Birth</label>

                    <input
                        type="date"
                        name="dateOfBirth"
                        class="form-control"
                        th:value="${student.dateOfBirth}">
                </div>


                <div class="mb-3">
                    <label class="form-label">Gender</label>

                    <select
                        name="gender"
                        class="form-select">

                        <option value="">Select Gender</option>

                        <option
                            value="Male"
                            th:selected="${student.gender == 'Male'}">
                            Male
                        </option>

                        <option
                            value="Female"
                            th:selected="${student.gender == 'Female'}">
                            Female
                        </option>

                        <option
                            value="Other"
                            th:selected="${student.gender == 'Other'}">
                            Other
                        </option>

                    </select>
                </div>


                <div class="mb-3">
                    <label class="form-label">College Name</label>

                    <input
                        type="text"
                        name="collegeName"
                        class="form-control"
                        th:value="${student.collegeName}">
                </div>


                <div class="mb-3">
                    <label class="form-label">Course</label>

                    <input
                        type="text"
                        name="course"
                        class="form-control"
                        th:value="${student.course}">
                </div>


                <div class="mb-3">
                    <label class="form-label">Graduation Year</label>

                    <input
                        type="number"
                        name="graduationYear"
                        class="form-control"
                        th:value="${student.graduationYear}">
                </div>


                <div class="mb-3">
                    <label class="form-label">CGPA</label>

                    <input
                        type="number"
                        step="0.01"
                        name="cgpa"
                        class="form-control"
                        th:value="${student.cgpa}">
                </div>


                <div class="mb-3">
                    <label class="form-label">Percentage</label>

                    <input
                        type="number"
                        step="0.01"
                        name="percentage"
                        class="form-control"
                        th:value="${student.percentage}">
                </div>


                <div class="mb-3">
                    <label class="form-label">Backlogs</label>

                    <input
                        type="number"
                        name="backlogs"
                        class="form-control"
                        min="0"
                        th:value="${student.backlogs}">
                </div>


                <button
                    type="submit"
                    class="btn btn-success">

                    Update Profile

                </button>

                <a
                    href="/student/profile"
                    class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

</body>

</html>
