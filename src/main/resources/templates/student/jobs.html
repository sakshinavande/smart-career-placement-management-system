
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Available Jobs - Smart Career</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" th:href="@{/student/dashboard}">
            Smart Career - Student
        </a>

        <a th:href="@{/student/dashboard}" class="btn btn-light">
            Back to Dashboard
        </a>
    </div>
</nav>

<div class="container mt-5">

    <h2>Available Jobs</h2>
    <p class="text-muted">Explore job opportunities posted by companies.</p>

    <div th:if="${#lists.isEmpty(jobs)}" class="alert alert-info">
        No jobs are available at the moment.
    </div>

    <div class="row g-4">

        <div class="col-md-6 col-lg-4" th:each="job : ${jobs}">
            <div class="card shadow-sm h-100">
                <div class="card-body">

                    <h5 class="card-title"
                        th:text="${job.jobTitle}">Job Title</h5>

                    <p>
                        <strong>Type:</strong>
                        <span th:text="${job.jobType}">Full-time</span>
                    </p>

                    <p>
                        <strong>Location:</strong>
                        <span th:text="${job.location}">Location</span>
                    </p>

                    <p>
                        <strong>Required Skills:</strong>
                        <span th:text="${job.requiredSkills}">Java, SQL</span>
                    </p>

                  <p>Minimum CGPA: <span th:text="${job.minCgpa}"></span></p>

                    <p>
                        <strong>Salary:</strong>
                        <span th:text="${job.salary}">Salary</span>
                    </p>

                    <p>
                        <strong>Status:</strong>
                        <span th:text="${job.status}"
                              class="badge bg-success">OPEN</span>
                    </p>

                </div>
            </div>
        </div>

    </div>

</div>

</body>
</html>
