<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Placements - Admin</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body>

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center">

        <h2>Placement Management</h2>

        <a href="/admin/dashboard"
           class="btn btn-primary">

            Dashboard

        </a>

    </div>

    <hr>

    <div class="table-responsive">

        <table class="table table-bordered table-striped">

            <thead class="table-dark">

            <tr>

                <th>ID</th>
                <th>Student ID</th>
                <th>Company ID</th>
                <th>Job ID</th>
                <th>Placement Date</th>
                <th>Status</th>

            </tr>

            </thead>

            <tbody>

            <tr th:each="placement : ${placements}">

                <td th:text="${placement.id}">
                    1
                </td>

                <td th:text="${placement.student.id}">
                    -
                </td>

                <td th:text="${placement.company.id}">
                    -
                </td>

                <td th:text="${placement.job.id}">
                    -
                </td>

                <td th:text="${placement.placementDate}">
                    -
                </td>

                <td th:text="${placement.status}">
                    -
                </td>

            </tr>

            </tbody>

        </table>

    </div>

</div>

</body>

</html>
