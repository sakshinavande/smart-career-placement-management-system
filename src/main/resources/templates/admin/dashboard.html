<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard - Smart Career</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body>

<nav class="navbar navbar-dark bg-primary">

    <div class="container">

        <a class="navbar-brand" href="/admin/dashboard">
            Smart Career - Admin
        </a>

        <form action="/logout" method="post">

            <button
                type="submit"
                class="btn btn-light">

                Logout

            </button>

        </form>

    </div>

</nav>


<div class="container mt-4">

    <h2 class="mb-4">
        Admin Dashboard
    </h2>


    <div class="row g-4">

        <!-- Students -->

        <div class="col-md-4">

            <div class="card shadow text-center">

                <div class="card-body">

                    <h5 class="card-title">
                        Total Students
                    </h5>

                    <h2 class="text-primary"
                        th:text="${totalStudents}">
                        0
                    </h2>

                    <a href="/admin/students"
                       class="btn btn-primary">

                        View Students

                    </a>

                </div>

            </div>

        </div>


        <!-- Companies -->

        <div class="col-md-4">

            <div class="card shadow text-center">

                <div class="card-body">

                    <h5 class="card-title">
                        Total Companies
                    </h5>

                    <h2 class="text-success"
                        th:text="${totalCompanies}">
                        0
                    </h2>

                    <a href="/admin/companies"
                       class="btn btn-success">

                        View Companies

                    </a>

                </div>

            </div>

        </div>


        <!-- Jobs -->

        <div class="col-md-4">

            <div class="card shadow text-center">

                <div class="card-body">

                    <h5 class="card-title">
                        Total Jobs
                    </h5>

                    <h2 class="text-warning"
                        th:text="${totalJobs}">
                        0
                    </h2>

                    <a href="/admin/jobs"
                       class="btn btn-warning">

                        View Jobs

                    </a>

                </div>

            </div>

        </div>


        <!-- Applications -->

        <div class="col-md-6">

            <div class="card shadow text-center">

                <div class="card-body">

                    <h5 class="card-title">
                        Total Applications
                    </h5>

                    <h2 class="text-info"
                        th:text="${totalApplications}">
                        0
                    </h2>

                    <a href="/admin/applications"
                       class="btn btn-info">

                        View Applications

                    </a>

                </div>

            </div>

        </div>


        <!-- Placements -->

        <div class="col-md-6">

            <div class="card shadow text-center">

                <div class="card-body">

                    <h5 class="card-title">
                        Total Placements
                    </h5>

                    <h2 class="text-danger"
                        th:text="${totalPlacements}">
                        0
                    </h2>

                    <a href="/admin/placements"
                       class="btn btn-danger">

                        View Placements

                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
