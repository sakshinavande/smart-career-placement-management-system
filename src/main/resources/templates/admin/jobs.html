<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Jobs - Admin</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body>

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center">

        <h2>Job Management</h2>

        <a href="/admin/dashboard"
           class="btn btn-primary">

            Dashboard

        </a>

    </div>

    <hr>

    <div class="table-responsive">

        <table class="table table-bordered table-striped">

            <thead class="table-dark">

            <tr>

                <th>ID</th>
                <th>Title</th>
                <th>Location</th>
                <th>Job Type</th>
                <th>Minimum CGPA</th>
                <th>Minimum Percentage</th>
                <th>Graduation Year</th>
                <th>Status</th>

            </tr>

            </thead>

            <tbody>

            <tr th:each="job : ${jobs}">

                <td th:text="${job.id}">
                    1
                </td>

                <td th:text="${job.title}">
                    -
                </td>

                <td th:text="${job.location}">
                    -
                </td>

                <td th:text="${job.jobType}">
                    -
                </td>

                <td th:text="${job.minimumCgpa}">
                    -
                </td>

                <td th:text="${job.minimumPercentage}">
                    -
                </td>

                <td th:text="${job.graduationYear}">
                    -
                </td>

                <td th:text="${job.status}">
                    -
                </td>

            </tr>

            </tbody>

        </table>

    </div>

</div>

</body>

</html>
